<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Group Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="join-screen" class="screen">
    <div class="card">
      <h1>Group Chat</h1>
      <input id="username-input" type="text" placeholder="Enter your username" maxlength="20" autocomplete="off" />
      <button id="join-btn">Join Chat</button>
      <p id="join-error" class="error hidden"></p>
    </div>
  </div>

  <div id="chat-screen" class="screen hidden">
    <div class="sidebar">
      <h2>Online</h2>
      <ul id="user-list"></ul>
    </div>
    <div class="chat-main">
      <div id="messages"></div>
      <p id="typing-indicator"></p>
      <form id="message-form">
        <input id="message-input" type="text" placeholder="Type a message..." maxlength="500" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
